<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نطاق — نظام متابعة العملاء والمشاريع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   هوية نطاق البصرية — منقولة حرفياً من NITAQ ERP v13
   الطبقة دي بصرية بالكامل: مفيش أي كلاس اتشال ولا اتغيّر اسمه،
   فالمنطق والوظائف والصلاحيات زي ما هي بالحرف.
   ══════════════════════════════════════════════════════════════ */
:root{
  /* نفس متغيّرات الـERP بالظبط */
  --ink:#132A46; --ink-soft:#4C617D; --ink-faint:#8996A8;
  --paper:#EDEEE8; --surface:#FFFFFF;
  --line:#D7D9D0; --line-strong:#B7BCAF;
  --brass:#A9824F; --brass-soft:#EDE1CB;
  --teal:#2E6E63;  --teal-soft:#DDEAE6;
  --rust:#AE4E2D;  --rust-soft:#F3DDD2;
  --amber:#B8862C; --amber-soft:#F3E5C4;
  --blue:#2F5E8C;  --blue-soft:#DDE7F1;
  --radius:5px;
  --shadow:0 1px 2px rgba(19,42,70,.06), 0 6px 18px rgba(19,42,70,.05);
  /* أسماء قديمة مربوطة على الجديدة عشان أي بقايا تفضل متسقة */
  --muted:var(--ink-soft); --red:var(--rust); --red-bg:var(--rust-soft);
  --green:var(--teal); --green-bg:var(--teal-soft);
  --gold:var(--brass); --navy:var(--ink); --pearl:var(--paper);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;width:100%}
body{
  font-family:'Tajawal',sans-serif; color:var(--ink); font-size:14px;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  /* ورق الرسم الهندسي — نفس خلفية الـERP */
  background:
    linear-gradient(var(--paper),var(--paper)),
    repeating-linear-gradient(0deg, rgba(19,42,70,.035) 0, rgba(19,42,70,.035) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(90deg, rgba(19,42,70,.035) 0, rgba(19,42,70,.035) 1px, transparent 1px, transparent 40px);
}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;margin:0;color:var(--ink)}
.en,.num{font-family:'Tajawal',sans-serif;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
span.en,span.num,b.num,div.num{display:inline-block}
td.num,th.num,td.en,th.en{display:table-cell}
button,input,select,textarea{font-family:'Tajawal',sans-serif;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}

/* ─────────── الهيكل: نفس توزيع الـERP ─────────── */
#root{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--ink);color:#EDEFEA;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
/* الشعار الرسمي — نفس مقاس وموضع الـERP بالظبط */
.blogo{width:110px;display:block;margin:0 auto 8px}
.brand p{margin:4px 0 0;font-size:11px;color:#AAB5C3;letter-spacing:.5px}
.vchip{display:inline-block;background:rgba(169,130,79,.22);color:var(--brass-soft);
  border-radius:20px;padding:1px 8px;font-size:10px;font-weight:700;vertical-align:middle;
  margin-inline-end:6px}

.nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav b{display:block;font-size:10.5px;color:#8794A6;letter-spacing:1px;padding:14px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;
  font-size:13.5px;color:#C7D0DB;margin-bottom:2px;border:1px solid transparent;
  transition:background .12s;position:relative;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(169,130,79,.18);color:#fff;border-color:rgba(169,130,79,.4)}
.nav a .ic{width:16px;text-align:center;flex:none;opacity:.9}
.nav a .pill{margin-inline-start:auto;background:var(--rust);color:#fff;border-radius:20px;
  padding:1px 7px;font-size:10.5px;font-weight:700}
.nav a .pill.q{background:rgba(255,255,255,.16)}
.sfoot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:#7C8AA0;line-height:1.7}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 28px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.top h2{font-size:19px;font-weight:800}
.top .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.grow{flex:1}
.wrap{padding:26px 28px 60px;max-width:1500px;width:100%}

/* ─────────── الكروت: بأركان الـERP الهندسية ─────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);position:relative}
.card::before,.card::after{content:"";position:absolute;top:8px;width:9px;height:9px;
  border-top:1.4px solid var(--line-strong);pointer-events:none;z-index:1}
.card::before{right:8px;border-right:1.4px solid var(--line-strong)}
.card::after{left:8px;border-left:1.4px solid var(--line-strong)}
.card-h{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card-h h3{font-size:15px;font-weight:800}
.card-h .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}
.grid{display:grid;gap:16px}

/* ─────────── الأزرار ─────────── */
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 16px;
  border-radius:4px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
  transition:background .12s}
.btn:hover{background:#0D1D33}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.gold:hover{background:#96713F}
.btn.ghost{border-color:var(--line-strong);background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(19,42,70,.05)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:4px}
.btn.danger{background:transparent;border-color:var(--rust-soft);color:var(--rust)}
.btn.danger:hover{background:var(--rust-soft)}
.btn.wa{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.wa:hover{background:#255A51}
.btn:disabled{cursor:not-allowed}

/* ─────────── الشارات = badge في الـERP ─────────── */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-red{background:var(--rust-soft);color:var(--rust)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-green{background:var(--teal-soft);color:var(--teal)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-gray{background:#EAEAE4;color:var(--ink-soft)}
.t-gold{background:var(--brass-soft);color:var(--brass)}

/* ─────────── النماذج ─────────── */
label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:700}
.in{width:100%;border:1px solid var(--line-strong);border-radius:4px;padding:9px 10px;
  background:#FBFBF9;color:var(--ink);outline:none;font-size:14px}
.in:focus{border-color:var(--brass);background:#fff}
textarea.in{min-height:74px;resize:vertical;line-height:1.7}
.f{margin-bottom:14px}
.req::after{content:" *";color:var(--rust)}

/* ─────────── الجداول ─────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface);text-align:right;font-size:11px;color:var(--ink-soft);font-weight:700;
  padding:8px 10px;border-bottom:1.4px solid var(--line-strong);letter-spacing:.3px;
  white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:10px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
tbody tr:hover{background:rgba(19,42,70,.025)}
tbody tr:last-child td{border-bottom:none}
tr.late{background:var(--rust-soft)} tr.late:hover{background:#EFD2C5}
tr.today{background:var(--amber-soft)} tr.today:hover{background:#EEDCB4}
.scroll{overflow:auto;max-height:66vh}
.empty{color:var(--ink-faint);text-align:center;padding:34px 20px;font-size:13px}
.empty .big{font-size:30px;margin-bottom:10px;opacity:.4}

/* ─────────── مؤشرات الأداء ─────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;position:relative;box-shadow:var(--shadow)}
.kpi::before,.kpi::after{content:"";position:absolute;top:8px;width:9px;height:9px;
  border-top:1.4px solid var(--line-strong)}
.kpi::before{right:8px;border-right:1.4px solid var(--line-strong)}
.kpi::after{left:8px;border-left:1.4px solid var(--line-strong)}
.kpi .v{font-family:'Cairo',sans-serif;font-size:26px;font-weight:800;margin-top:8px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink-soft)}
.kpi.r .v{color:var(--rust)} .kpi.a .v{color:var(--amber)}
.kpi.g .v{color:var(--teal)} .kpi.b .v{color:var(--blue)}
.kpi.click{cursor:pointer;transition:.15s}
.kpi.click:hover{border-color:var(--brass)}

/* ─────────── مسار التحويل ─────────── */
.funnel{padding:18px 20px}
.fr{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.fr .nm{width:118px;flex:0 0 118px;font-size:12px;font-weight:700;text-align:left;color:var(--ink-soft)}
.fr .bar{flex:1;height:24px;background:#E6E7E0;border-radius:3px;overflow:hidden}
.fr .fill{height:100%;background:var(--ink);border-radius:3px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.fr.win .fill{background:var(--brass)}
.fr.lost .fill{background:var(--line-strong)}
.fr .c{width:34px;text-align:center;font-weight:800;font-family:'Cairo',sans-serif;font-size:14px}
.conv{margin-top:14px;padding:14px 16px;background:var(--ink);border-radius:var(--radius);
  color:#EDEFEA;display:flex;align-items:center;gap:14px}
.conv .big{font-size:26px;font-weight:800;color:var(--brass-soft);font-family:'Cairo',sans-serif}
.conv .tx{font-size:12px;line-height:1.7;color:#AAB5C3}
.bars .b{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12px}
.bars .b .n{width:96px;flex:0 0 96px;font-weight:700;color:var(--ink-soft)}
.bars .b .tr{flex:1;height:15px;background:#E6E7E0;border-radius:3px;overflow:hidden}
.bars .b .fl{height:100%;background:var(--brass);border-radius:3px}
.bars .b .v{width:26px;text-align:center;font-weight:800;font-family:'Cairo',sans-serif}

/* ─────────── كروت المهام (يومي) — بلغة كروت الـERP ─────────── */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);position:relative;border-top:2px solid var(--line-strong)}
.fc::before,.fc::after{content:"";position:absolute;top:10px;width:9px;height:9px;
  border-top:1.4px solid var(--line-strong)}
.fc::before{right:8px;border-right:1.4px solid var(--line-strong)}
.fc::after{left:8px;border-left:1.4px solid var(--line-strong)}
.fc.late{border-top-color:var(--rust)} .fc.today{border-top-color:var(--amber)}
.fc.next{border-top-color:var(--teal)} .fc.none{border-top-color:var(--rust)}
.fc .nm{font-size:15px;font-weight:800;font-family:'Cairo',sans-serif;margin-bottom:2px}
.fc .meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:9px}
.fc .note{background:#F6F6F2;border:1px solid var(--line);border-radius:4px;padding:9px 11px;
  font-size:11.5px;line-height:1.7;color:var(--ink-soft);margin:9px 0;max-height:62px;overflow:hidden}
.fc .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.secbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;cursor:pointer;user-select:none}
.secbar .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}
.secbar h3{font-size:15px;font-weight:800}
.secbar .chev{font-size:13px;color:var(--ink-soft)}
.secbar:hover h3{color:var(--brass)}
.moreb{margin:0 0 24px}

/* ─────────── الدرج والنوافذ ─────────── */
.ov{position:fixed;inset:0;background:rgba(19,42,70,.45);z-index:50;display:flex;justify-content:flex-start}
.dw{background:var(--paper);width:min(720px,100%);height:100%;overflow:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.25);animation:sl .22s ease}
@keyframes sl{from{transform:translateX(-40px);opacity:.4}to{transform:none;opacity:1}}
.dw-h{position:sticky;top:0;background:var(--ink);color:#fff;padding:18px 22px;
  display:flex;align-items:center;gap:12px;z-index:5}
.dw-h h3{font-size:16px;color:#fff}
.dw-h .s{font-size:11.5px;color:var(--brass-soft);margin-top:3px}
.dw-b{padding:20px 22px 90px}
.dw-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:16px 22px;display:flex;gap:10px}
.x{margin-inline-start:auto;background:none;border:none;font-size:18px;color:#AAB5C3}
.x:hover{color:#fff}
.mo{position:fixed;inset:0;background:rgba(19,42,70,.45);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px}
.mo .box{background:var(--surface);border-radius:6px;width:480px;max-width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mo .box h3{padding:18px 22px;border-bottom:1px solid var(--line);font-size:16px}
.mo .box .bd{padding:20px 22px}
.mo .box .ft{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}

/* ─────────── الخط الزمني ─────────── */
.tl{position:relative;padding-right:18px}
.tl::before{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:1px;
  border-right:1px dashed var(--line-strong)}
.tli{position:relative;margin-bottom:14px}
.tli::before{content:"";position:absolute;right:-17px;top:5px;width:9px;height:9px;
  border-radius:50%;background:var(--brass);border:2px solid var(--paper)}
.tli .d{font-size:11px;color:var(--ink-soft);font-weight:700}
.tli .t{font-size:12.5px;line-height:1.7;margin-top:3px}

/* ─────────── عناصر مشتركة ─────────── */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);
  border-bottom:2px solid transparent;white-space:nowrap;background:none}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filt .in{width:auto;min-width:118px;padding:7px 10px;font-size:12.5px}
.hint{font-size:11.5px;color:var(--ink-soft);line-height:1.75}
.hint b{color:var(--ink)}
.warn{background:var(--amber-soft);border:1px solid #E4CE93;border-radius:4px;
  padding:11px 13px;font-size:12px;line-height:1.75;color:#6E5116}
.toast{position:fixed;bottom:24px;left:24px;background:var(--ink);color:#fff;padding:12px 18px;
  border-radius:var(--radius);font-size:13px;font-weight:700;z-index:99;
  box-shadow:0 12px 30px rgba(19,42,70,.3);animation:sl .2s;display:flex;align-items:center;gap:12px}
.tundo{background:var(--brass);color:#fff;border-radius:4px;padding:5px 12px;font-weight:700;font-size:12px}
.tundo:hover{background:#96713F}
.cta{background:var(--ink);color:#EDEFEA;border-radius:var(--radius);padding:16px 20px;
  margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.cta .tx{flex:1;min-width:190px;font-size:12.5px;line-height:1.75}
.cta b{color:var(--brass-soft)}
.ptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.rowbtns{display:flex;gap:5px}
.ro{display:inline-block;padding:4px 7px;font-size:12.5px;color:var(--ink-soft)}
.nml{padding:4px 7px;font-weight:800;font-size:13px;color:var(--ink);text-align:right;
  border-radius:4px;border:1px solid transparent;transition:.12s;background:none}
.nml:hover{border-color:var(--brass);background:#fff;color:var(--brass)}

/* ─────────── التعديل المباشر ─────────── */
.ed{width:100%;min-width:118px;padding:5px 8px;border:1px solid transparent;border-radius:4px;
  background:transparent;font-size:12.5px;font-family:inherit;color:inherit;cursor:pointer;transition:.12s}
.ed:hover{border-color:var(--line-strong);background:#FBFBF9}
.ed:focus{border-color:var(--brass);background:#fff;outline:none;cursor:text}
.ed.dt{min-width:118px;direction:ltr;text-align:right}
.ed.ltr{direction:ltr;text-align:right}
.ed.g{font-weight:700;border-radius:20px;text-align:center;min-width:96px;padding:4px 9px}
.ed.t-red{background:var(--rust-soft);color:var(--rust)}
.ed.t-amber{background:var(--amber-soft);color:var(--amber)}
.ed.t-green{background:var(--teal-soft);color:var(--teal)}
.ed.t-blue{background:var(--blue-soft);color:var(--blue)}
.ed.t-gray{background:#EAEAE4;color:var(--ink-soft)}
.ed.t-gold{background:var(--brass-soft);color:var(--brass)}
.ed.nm{font-weight:800;font-size:13px;min-width:130px}
.ed.wide{min-width:210px}
.ed.wide2{min-width:150px}
.ed.area{display:block;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;
  line-height:1.6;font-family:inherit}
tbody tr:hover .ed{border-color:#E6E7E0}

/* ─────────── الأعمدة المثبّتة ─────────── */
td.stk,th.stk{position:sticky;inset-inline-start:var(--stk,0)}
td.stk{z-index:3;background:var(--surface)}
th.stk{z-index:7;background:var(--surface)}
tr.late  td.stk{background:var(--rust-soft)}
tr.today td.stk{background:var(--amber-soft)}
tbody tr:hover td.stk{background:#F4F5F1}
tbody tr.late:hover  td.stk{background:#EFD2C5}
tbody tr.today:hover td.stk{background:#EEDCB4}
td.stkEdge,th.stkEdge{box-shadow:-7px 0 9px -7px rgba(19,42,70,.22)}
td.stk-name .nml{white-space:normal;text-align:right}
@media(max-width:760px){
  td.stkOpt,th.stkOpt{position:static!important;box-shadow:none!important}
  td.stk-name,th.stk-name{box-shadow:-7px 0 9px -7px rgba(19,42,70,.22);
    width:126px!important;min-width:126px!important;max-width:126px!important}
}

/* ─────────── لوحة الأعمدة ─────────── */
.pop{position:relative;display:inline-block}
.pop .panel{position:fixed;left:12px;right:12px;top:auto;bottom:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 16px 44px rgba(19,42,70,.18);
  padding:10px;z-index:50;width:auto;max-width:none;max-height:70vh;overflow:auto}
.pop .panel .hd{display:flex;gap:6px;padding:2px 2px 9px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pop .panel label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:4px;
  font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;margin:0}
.pop .panel label:hover{background:#F4F5F1}
.pop .panel label.lock{opacity:.45;cursor:not-allowed}
.pop .panel input{accent-color:var(--brass)}
.backdrop{position:fixed;inset:0;z-index:45}
/* القائمة دايماً ثابتة على الشاشة نفسها (مش متعلّقة تحت الزرار) — بتبدأ
   من حرف الشاشة الشمال لحد حرفها اليمين، بغض النظر عن مكان الزرار أو
   مقدار السكرول الأفقي في الجدول اللي وراها. فمفيش سيناريو تقدر فيه
   القائمة تطلع نص شكلها برّه حدود الشاشة. على الشاشات الواسعة (كمبيوتر)
   بنرجّعها تتعلّق بشكل طبيعي تحت الزرار بعرض معقول. */
@media (min-width:900px){
  .pop .panel{position:absolute;left:auto;right:auto;top:calc(100% + 6px);bottom:auto;
    inset-inline-start:0;width:252px;max-height:330px}
}

/* ─────────── ترقيم الصفحات ─────────── */
.pgbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;
  border-top:1px solid var(--line);background:#F6F6F2;border-radius:0 0 var(--radius) var(--radius)}

/* ─────────── حالة الحفظ ─────────── */
.svchip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;
  border:1px solid transparent}
.svchip.saved{background:var(--teal-soft);color:var(--teal)}
.svchip.saving{background:var(--amber-soft);color:var(--amber)}
.svchip.fail{background:var(--rust-soft);color:var(--rust);border-color:var(--rust)}
.savefail{background:var(--rust);color:#fff;padding:12px 28px;display:flex;flex-direction:column;gap:3px;
  position:sticky;top:0;z-index:19;box-shadow:0 3px 12px rgba(174,78,45,.35)}
.savefail b{font-size:13.5px;font-weight:800;line-height:1.5}
.savefail span{font-size:11.5px;opacity:.92;line-height:1.6}

/* ─────────── سجل التعديلات ─────────── */
.chg{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.chg .cf{font-weight:800;font-size:12.5px;min-width:104px;color:var(--ink)}
.chg .cv{font-size:12.5px;flex:1;min-width:180px;line-height:1.7}
.chg .cv .old{background:var(--rust-soft);color:var(--rust);padding:1px 7px;border-radius:3px;text-decoration:line-through}
.chg .cv .new{background:var(--teal-soft);color:var(--teal);padding:1px 7px;border-radius:3px}
.chg .cm{font-size:11px;color:var(--ink-faint);white-space:nowrap}

/* ─────────── الموبايل ─────────── */
@media(max-width:900px){
  #root{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:column;overflow:visible}
  .brand{border-bottom:1px solid rgba(255,255,255,.12);padding:12px 16px}
  .brand p{display:none}
  .nav{display:flex;flex-wrap:wrap;padding:8px;gap:5px;flex:none;overflow:visible}
  .nav b,.sfoot{display:none}
  .nav a{margin:0;white-space:nowrap;padding:7px 11px;font-size:12.5px}
  .wrap{padding:18px 14px 60px}
  .top{padding:13px 16px} .top h2{font-size:16px}
  .dw{width:100%}
  .svchip{font-size:10.5px;padding:3px 8px}
  .savefail{padding:10px 16px}
  .pgbar{padding:10px}
}

/* ══════════════ الطباعة — نفس أسلوب مستندات الـERP ══════════════ */
.printsheet{display:none}
@media print{
  @page{size:A4 portrait;margin:11mm 10mm}
  html,body{background:#fff!important;height:auto!important;min-height:0!important;overflow:visible!important}
  #root{display:block!important;min-height:0!important;height:auto!important}
  #root>aside,#root>.main,.side,.top,.ov,.mo,.toast,.savefail,.svchip,.pgbar,.no-print{display:none!important}
  .printsheet{display:block!important}
  a[href]:after{content:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
.psheet{font-family:'Tajawal',sans-serif;color:var(--ink);font-size:10.5pt}
.psheet+.psheet{page-break-before:always;break-before:page}
/* ترويسة المستند: شريط حبر بحد نحاسي — نفس ترويسة مستندات الـERP.
   ضروري كمان لأن حبر الشعار أبيض فمايبانش على ورق أبيض. */
.ph{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;
  padding:12px 16px;border-bottom:3px solid var(--brass);margin-bottom:9px}
.plogo{height:44px;width:auto;display:block;flex:none}
.ph h1{font-size:14pt;font-weight:800;line-height:1.25;color:#fff}
.ph .sb{font-size:8pt;color:#AAB5C3;margin-top:2px;letter-spacing:.3px}
.ph .who{margin-inline-start:auto;text-align:left;font-size:9.5pt;line-height:1.6;color:#C7D0DB}
.ph .who b{font-size:12pt;color:#fff}
.pmeta{display:flex;gap:14px;font-size:8.5pt;color:var(--ink-soft);margin-bottom:10px;flex-wrap:wrap}
.psec{margin-bottom:10px}
.psec h2{font-size:10pt;font-weight:800;background:#F0F0EA;
  border-inline-start:3px solid var(--brass);padding:4px 9px;margin-bottom:4px}
.ptab{width:100%;border-collapse:collapse}
.ptab th{background:#fff;color:var(--ink-soft);font-size:8pt;font-weight:800;
  border-bottom:1.2px solid var(--ink);padding:3px 4px;text-align:right;position:static}
.ptab td{border-bottom:1px solid var(--line);padding:5px 4px;font-size:9pt;vertical-align:top;line-height:1.5}
.cbx{display:inline-block;width:11px;height:11px;border:1.2px solid var(--ink);border-radius:2px}
.pline{border-bottom:1px dotted var(--line-strong);display:block;min-height:15px}
.pfoot{margin-top:16px;padding-top:10px;border-top:1px solid var(--line-strong);
  display:flex;gap:26px;font-size:9pt}
.pfoot div{flex:1}
.pfoot .sig{border-bottom:1px solid var(--ink);height:26px;margin-top:4px}
.pnote{font-size:7.5pt;color:var(--ink-faint);margin-top:10px;text-align:center}
.rtab{width:100%;border-collapse:collapse;table-layout:auto}
.rtab thead{display:table-header-group}
.rtab tr{page-break-inside:avoid;break-inside:avoid}
.rtab th{background:#F0F0EA!important;color:var(--ink);font-size:7.5pt;font-weight:800;
  border:1px solid var(--line-strong);padding:3px 4px;text-align:right;position:static;white-space:normal}
.rtab td{border:1px solid var(--line);padding:3px 4px;font-size:8pt;vertical-align:top;
  line-height:1.45;word-break:break-word}
.rtab tr:nth-child(even) td{background:#FAFAF7!important}
.rtab .lt{background:var(--rust-soft)!important}
.rtab .td2{background:var(--amber-soft)!important}
.rsmall{font-size:7pt;color:var(--ink-soft)}
</style>

/* تقسيم مهام اليوم — مصدر واحد تستخدمه الشاشة والطباعة */
function taskBuckets(db,pred){
  const T=todayISO();
  const ci=cIdx(db);
  const all=db.leads.filter(pred).map(l=>({l,f:followUp(l),s:inGrade(l),
    c:ci.get(l.clientId)||{}}));
  const late =all.filter(x=>x.f.k==='late').sort((a,b)=>b.f.days-a.f.days);
  const now  =all.filter(x=>x.f.k==='today');
  const deliv=all.filter(x=>x.l.deliverDate&&x.l.workst!=='Done'&&diffDays(T,x.l.deliverDate)>=-7)
                 .sort((a,b)=>a.l.deliverDate.localeCompare(b.l.deliverDate));
  const foll =all.filter(x=>(x.f.k==='next'&&-x.f.days<=7)||x.f.k==='none'||(gradeOf(x.l.grade).live&&x.s.stale))
                 .sort((a,b)=>b.s.days-a.s.days);
  /* السجل يظهر في قسم واحد بس — الأولوية: متأخر ← اليوم ← تسليم ← متابعة */
  const seen=new Set();
  const uniq=arr=>arr.filter(x=>{if(seen.has(x.l.id))return false;seen.add(x.l.id);return true});
  return {late:uniq(late),now:uniq(now),deliv:uniq(deliv),foll:uniq(foll)};
}

/* ===== فهارس ===== 
   WeakMap مربوطة بمرجع المصفوفة: الفهرس بيتبني مرة واحدة، ولما المصفوفة تتغيّر
   (كل تعديل بيعمل مصفوفة جديدة) بيتبني من جديد. صفر مسح متكرر جوه الحلقات. */
const _byId=new WeakMap();
function idxById(arr){
  if(!arr) return new Map();
  let m=_byId.get(arr);
  if(!m){m=new Map();for(const x of arr)m.set(x.id,x);_byId.set(arr,m)}
  return m;
}
const _byKey=new WeakMap();
function idxGroup(arr,key){
  if(!arr) return new Map();
  let box=_byKey.get(arr);
  if(!box){box={};_byKey.set(arr,box)}
  if(!box[key]){const m=new Map();
    for(const x of arr){const k=x[key];if(k==null)continue;
      let a=m.get(k);if(!a){a=[];m.set(k,a)}a.push(x)}
    box[key]=m}
  return box[key];
}

   نرجّع العدّاد للرقم اللي قبله. كده لو الترفيع كان غلطة (أو اتصلّح بسرعة) الرقم يرجع للمخزون تمام،
   ولو حد استخدم رقم بعده فعلاً في الأثناء، العدّاد بيفضل زي ما هو (زي ما كان قبل كده بالظبط). */
function releaseProjectSeq(db,releasedId,releasedNum){
  const n=parseInt(String(releasedNum||''),10)||0;
  if(!n||n!==(db.projSeq||0)) return db.projSeq||0;
  const others=(db.leads||[]).filter(x=>x.id!==releasedId)
    .map(x=>parseInt(String(x.projectNo||''),10)).filter(v=>!isNaN(v));
  return Math.max(104,...others,0);
}

function normPhone(raw){
  if(!raw) return '';
  let p=String(raw).replace(/[^\d+]/g,'').replace(/^00/,'+');
  if(p.startsWith('+')) return p;
  if(p.startsWith('971')) return '+'+p;
  if(p.startsWith('05')&&p.length===10) return '+971'+p.slice(1);
  if(p.startsWith('5')&&p.length===9) return '+971'+p;
  if(p.length>10) return '+'+p;
  return p;
}

/* محرك المتابعة — للنشطين فقط (فعال / هام / هام جدا) */
function followUp(l){
  if(!gradeOf(l.grade).live) return {k:'na',l:'—',days:0,c:'t-gray'};
  if(!l.nextDate)            return {k:'none',l:'بدون موعد',days:0,c:'t-red'};
  const d=diffDays(todayISO(),l.nextDate);
  if(d>0)  return {k:'late', l:'متأخر '+d+' يوم',days:d,c:'t-red'};
  if(d===0)return {k:'today',l:'اليوم',days:0,c:'t-amber'};
  return {k:'next',l:'بعد '+(-d)+' يوم',days:d,c:'t-green'};
}
/* حالة موعد التسليم — لكل السجلات بغضّ النظر عن الدرجة. بدون موعد = من غير لون */
function deliverStatus(l){
  if(!l.deliverDate) return {k:'none',days:0};
  const d=diffDays(todayISO(),l.deliverDate);
  if(d>0)  return {k:'late', days:d};
  if(d===0)return {k:'today',days:0};
  return {k:'next',days:d};
}
/* كام يوم قاعد في نفس الدرجة + هل ركد */
function inGrade(l){
  const log=l.gradeLog||[]; const since=log.length?log[log.length-1].date:l.createdAt;
  const days=diffDays(todayISO(),since);
  const lim=STALE[l.grade];
  return {days,since,stale:lim!=null&&days>lim,lim};
}

/* ============ 3. التخزين ============ */
/* البيانات مقسومة تلات مفاتيح مستقلة.
   ترتيب الكتابة مقصود: core الأول (البيانات الحرجة) ← audit (صغير وهو وسيلة الاسترجاع)
   ← inter (الأكبر والأقل حرجاً). كده لو المساحة ضاقت، اللي بينجو هو الأهم.
   تنبيه: حد التخزين مشترك للموقع كله مش لكل مفتاح — الفصل بيحكم اللي يضيع، مش بيرفع السقف. */
const SKEYS={core:'nitaq_crm_core',inter:'nitaq_crm_inter',audit:'nitaq_crm_audit'};
const SORDER=['core','audit','inter'];
const LEGACY_KEY='nitaq_crm_v4';
const OLDKEYS=['nitaq_crm_v3','nitaq_crm_v2','nitaq_crm_v1'];
let mem=null;

/* ترقية أي نسخة قديمة: الأسماء النصية بتتحول لأرقام مستخدمين.
   لو لقى اسم مالوش مستخدم، بينشئ له واحد بدل ما السجل يتيتّم. */
/* استكمال حقول التتبّع للبيانات القديمة.
   بيرجّع نفس الكائن بالمرجع لو مفيش أي نقص — عشان ما يعملش كتابة زايدة للتخزين. */
function ensureMeta(d){
  if(!d||!Array.isArray(d.clients)) return d;
  let changed=false;
  const clients=d.clients.map(c=>{
    const created=c.createdAt||'';
    if(c.createdBy!==undefined&&c.updatedAt!==undefined&&c.updatedBy!==undefined&&c.createdAt!==undefined) return c;
    changed=true;
    return {...c,
      createdAt:created,
      createdBy:c.createdBy===undefined?'':c.createdBy,
      updatedAt:c.updatedAt===undefined?created:c.updatedAt,
      updatedBy:c.updatedBy===undefined?'':c.updatedBy};
  });
  return changed?{...d,clients}:d;
}

function migrate(d){
  if(!d||!d.leads) return d;
  d=ensureMeta(d);
  if(d.v>=4) return d;
  const users=(d.users&&d.users.length)?[...d.users]:[{id:'u1',name:'سيد',role:'owner',pin:'',perms:{},active:true}];
  const find=n=>{
    const t=String(n||'').trim(); if(!t) return '';
    let u=users.find(x=>String(x.name).trim()===t);
    if(!u){u={id:uid(),name:t,role:'engineer',pin:'',perms:{...BASE_PERMS},active:true};users.push(u)}
    return u.id;
  };
  const leads=d.leads.map(l=>{
    const n={...l};
    n.projectNo=(l.projectNo===0||l.projectNo)?String(l.projectNo):'';
    n.sketchNo=(l.sketchNo===0||l.sketchNo)?String(l.sketchNo):'';
    if(!n.ownerId)    n.ownerId=find(l.owner);
    if(!n.engineerId) n.engineerId=find(l.engineer);
    delete n.owner; delete n.engineer;
    if(n.snoozed==null) n.snoozed=0;
    return n;
  });
  const inter=(d.inter||[]).map(i=>{
    const n={...i};
    if(!n.byId) n.byId=find(i.by);
    delete n.by; return n;
  });
  const lookups={...(d.lookups||{})}; delete lookups.owner; delete lookups.engineer;
  const seq=Math.max(0,d.projSeq||0,...leads.map(l=>parseInt(String(l.projectNo||'0'),10)||0));
  return {...d,users,leads,inter,lookups,projSeq:seq,v:4};
}

/* شريحة core = كل حاجة ما عدا سجل التواصل وسجل التعديلات */
const coreSlice=d=>({clients:d.clients,leads:d.leads,users:d.users,lookups:d.lookups,
  ui:d.ui,projSeq:d.projSeq,v:d.v});

/* آخر حالة اتكتبت بنجاح — بالمرجع، عشان نكتب الشريحة المتغيّرة بس.
   شغّال لأن كل التعديلات في النظام بتعمل كائنات جديدة (spread) مش بتعدّل في محلها. */
const saved={clients:null,leads:null,users:null,lookups:null,ui:null,projSeq:null,inter:null,audit:null};
function dirtySlices(d){
  return {
    core: d.clients!==saved.clients||d.leads!==saved.leads||d.users!==saved.users
          ||d.lookups!==saved.lookups||d.ui!==saved.ui||d.projSeq!==saved.projSeq,
    audit: d.audit!==saved.audit,
    inter: d.inter!==saved.inter
  };
}
function markSaved(d,k){
  if(k==='core'){saved.clients=d.clients;saved.leads=d.leads;saved.users=d.users;
    saved.lookups=d.lookups;saved.ui=d.ui;saved.projSeq=d.projSeq}
  if(k==='audit') saved.audit=d.audit;
  if(k==='inter') saved.inter=d.inter;
}

const readKey=k=>{
  try{const r=localStorage.getItem(k);return r==null?{empty:true}:{v:JSON.parse(r)}}
  catch(e){return {bad:true}}
};

const store={
  /* بيرجّع {db, bad:[مفاتيح تالفة], from, needSave} */
  load(){
    const out={bad:[],from:null,needSave:false};
    let c,i,a;
    try{ c=readKey(SKEYS.core); i=readKey(SKEYS.inter); a=readKey(SKEYS.audit); }
    catch(e){ c=i=a={bad:true} }
    ['core','inter','audit'].forEach((k,x)=>{const r=[c,i,a][x]; if(r&&r.bad) out.bad.push(k)});

    if(c&&c.v&&Array.isArray(c.v.leads)){
      out.from='split';
      out.db=migrate({...c.v,
        inter:(i&&Array.isArray(i.v))?i.v:[],
        audit:(a&&Array.isArray(a.v))?a.v:[]});
      /* لو مفتاح تالف أو ناقص، بنكمّل بفاضي ونكتب تاني عشان يتصلّح */
      if(out.bad.length) out.needSave=true;
      return out;
    }

    /* المفتاح القديم — بينقل مرة واحدة، وعمره ما بيتمسح (بيفضل نسخة احتياطية) */
    for(const k of [LEGACY_KEY,...OLDKEYS]){
      const o=readKey(k);
      if(o&&o.v&&Array.isArray(o.v.leads)){
        out.from=k; out.db=migrate(o.v); out.needSave=true; return out;
      }
    }
    if(mem){ out.from='memory'; out.db=migrate(mem); out.needSave=true; return out; }
    return out;
  },

  /* بيرجّع {ok:[...], fail:[...]} — نجاح جزئي ممكن جداً */
  save(d,force){
    mem=d;
    const res={ok:[],fail:[]};
    const dirty=dirtySlices(d);
    const payload={core:coreSlice(d),audit:d.audit||[],inter:d.inter||[]};
    for(const k of SORDER){
      if(!force&&!dirty[k]){ res.ok.push(k); continue; }
      try{
        localStorage.setItem(SKEYS[k],JSON.stringify(payload[k]));
        markSaved(d,k); res.ok.push(k);
      }catch(e){ res.fail.push(k); }
    }
    return res;
  },

  /* للتوافق مع أي كود قديم */
  read(){ return this.load().db||null }
};

function cloudRowsToDb(rows, profiles){

    if(r.entity==='settings'){
      if(r.data&&r.data.lookups) out.lookups=r.data.lookups;
      if(r.data&&r.data.projSeq!=null) out.projSeq=r.data.projSeq;
      return;
    }
    const k=ENT2KEY[r.entity];
    if(k&&r.data) out[k].push(r.data);
  });
  out.users=(profiles||[]).map(p=>({id:p.id,name:p.name,email:p.email||'',authId:p.auth_user_id||'',
    role:p.role||'engineer',perms:p.perms||{...BASE_PERMS},active:p.active!==false}));
  return migrate(out);
}

/* ديف بسيط بين مصفوفتين بالـid — للاستخدام في المزامنة الجزئية والدفع الأولي */
function diffArrById(oldArr, newArr){
  const oldMap=new Map((oldArr||[]).map(x=>[x.id,x]));
  const newMap=new Map((newArr||[]).map(x=>[x.id,x]));
  const changed=[], removed=[];
  newMap.forEach((v,id)=>{ if(oldMap.get(id)!==v) changed.push(v) });
  oldMap.forEach((v,id)=>{ if(!newMap.has(id)) removed.push(id) });
  return {changed, removed};
}

/* رفع كل البيانات المحلية للسحابة دفعة واحدة — أول مرة بعد الربط */
async function pushAllToCloud(sb, db, onProgress){
  const rows=[];
  (db.clients||[]).forEach(c=>rows.push({id:c.id, entity:'client', data:c}));
  (db.leads||[]).forEach(l=>rows.push({id:l.id, entity:'lead', data:l}));
  (db.inter||[]).forEach(i=>rows.push({id:i.id, entity:'inter', data:i}));
  (db.audit||[]).forEach(a=>rows.push({id:a.aid||uid(), entity:'audit', data:a}));
  rows.push({id:'settings', entity:'settings', data:{lookups:db.lookups, projSeq:db.projSeq||0}});
  const CH=200;
  for(let i=0;i<rows.length;i+=CH){
    const batch=rows.slice(i,i+CH).map(r=>({...r, updated_at:new Date().toISOString()}));
    const {error}=await sb.from('nitaq_crm_records').upsert(batch);
    if(error){console.error('pushAllToCloud',error); return {ok:false,error}}
    if(onProgress) onProgress(Math.min(i+CH,rows.length), rows.length);
  }
  /* المستخدمون القدامى (زي 'u1'، 'u2'...) بيتنقلوا كـ"بروفايلات قديمة" — من غير
     حساب دخول مربوط بيهم لسه. أهميتهم إنهم بيحافظوا على نفس الـid اللي الاسكتشات
     والمشاريع القديمة بتشاور عليه (ownerId/engineerId)، فلما صاحب الحساب الحقيقي
     يتربط بيهم بعدين (زرار "دمج مستخدم قديم" من شاشة المستخدمون)، كل سجلاته
     القديمة بترجع تظهر ليه تلقائياً من غير أي تعديل يدوي فيها. */
  const legacyPush=await pushLegacyUsers(sb, db.users||[]);
  return {ok:true, count:rows.length, legacy:legacyPush};
}

/* بيضيف أي مستخدم قديم مش موجود أصلاً في nitaq_crm_profiles — ومبيلمسش
   أي بروفايل موجود بالفعل (خصوصاً لو مربوط بحساب دخول حقيقي) */
async function pushLegacyUsers(sb, users){
  try{
    const {data:existing,error:e1}=await sb.from('nitaq_crm_profiles').select('id');
    if(e1){console.error('pushLegacyUsers select',e1); return {ok:false}}
    const have=new Set((existing||[]).map(p=>p.id));
    const toAdd=(users||[]).filter(u=>!have.has(u.id))
      .map(u=>({id:u.id, name:u.name, role:u.role==='owner'?'engineer':(u.role||'engineer'),
        perms:u.perms||{...BASE_PERMS}, active:u.active!==false}));
    if(!toAdd.length) return {ok:true, added:0};
    const {error:e2}=await sb.from('nitaq_crm_profiles').insert(toAdd);
    if(e2){console.error('pushLegacyUsers insert',e2); return {ok:false}}
    return {ok:true, added:toAdd.length};
  }catch(e){console.error(e); return {ok:false}}
}

/* دمج بروفايل قديم (من غير حساب دخول) بحساب دخول حقيقي بالفعل —
   البروفايل القديم بياخد auth_user_id بتاع الحساب الحقيقي، والبروفايل
   المكرر الجديد (اللي اتعمل تلقائياً وقت التسجيل) بيتشال. */
async function mergeLegacyProfile(sb, legacyId, realProfile){
  try{
    const {error:e1}=await sb.from('nitaq_crm_profiles')
      .update({auth_user_id:realProfile.auth_user_id, active:true}).eq('id', legacyId);
    if(e1){console.error('mergeLegacyProfile update',e1); return {ok:false,error:e1}}
    const {error:e2}=await sb.from('nitaq_crm_profiles').delete().eq('id', realProfile.id);
    if(e2){console.error('mergeLegacyProfile delete',e2); return {ok:false,error:e2}}
    return {ok:true};
  }catch(e){console.error(e); return {ok:false,error:e}}
}

/* مقارنة نسختين وإخراج التغييرات على مستوى الخانة */
function diffDb(a,b){
  const out=[];
  const scan=(t,fields,A,B)=>{
    const ma={}; (A||[]).forEach(x=>ma[x.id]=x);
    const mb={}; (B||[]).forEach(x=>mb[x.id]=x);
    (B||[]).forEach(x=>{
      const p=ma[x.id];
      if(!p){out.push({t,rid:x.id,f:'__new',from:'',to:''});return}
      fields.forEach(f=>{
        const u=p[f]===undefined?'':p[f], v=x[f]===undefined?'':x[f];
        if(String(u)!==String(v)) out.push({t,rid:x.id,f,from:u,to:v});
      });
    });
    (A||[]).forEach(x=>{if(!mb[x.id]) out.push({t,rid:x.id,f:'__del',from:JSON.stringify(x),to:''})});
  };
  scan('lead',LEAD_F,a.leads,b.leads);
  scan('client',CLIENT_F,a.clients,b.clients);
  scan('user',USER_F,a.users,b.users);
  return out;
}

    const ci=cIdx(db), used=new Set();
    const fuA=[], igA=[], cA=[];
    for(const l of leads){ fuA.push(followUp(l)); igA.push(inGrade(l));
      const c=ci.get(l.clientId)||{}; cA.push(c); if(c.id)used.add(c.id); }
    return {fuA,igA,cA,clients:db.clients.filter(c=>used.has(c.id))};
  },[leads,db.clients]);
  const clients=M.clients;
  const fu=M.fuA;
  const g=id=>leads.filter(l=>l.grade===id).length;
  const late=fu.filter(f=>f.k==='late').length, tod=fu.filter(f=>f.k==='today').length;
  const noDate=leads.filter((l,i)=>fu[i].k==='none').length;
  const stale=leads.reduce((n,l,i)=>n+((gradeOf(l.grade).live&&M.igA[i].stale)?1:0),0);
  const uidset=new Set(((all||db).users||[]).map(u=>u.id));
  const orphan=leads.filter(l=>(l.ownerId&&!uidset.has(l.ownerId))||(l.engineerId&&!uidset.has(l.engineerId))).length;
  const proj=g('proj'), dead=g('dead'), closed=proj+dead;
  /* تمريرة واحدة على كل السجلات تبني إحصاءات كل المهندسين */
  const ENG=useMemo(()=>{
    const m=new Map();
    if(!all) return m;
    const get=id=>{let v=m.get(id);if(!v){v={liv:0,lt:0,td:0,st:0,pr:0,dd:0};m.set(id,v)}return v};
    for(const l of all.leads){
      const f=followUp(l), g=inGrade(l), live=gradeOf(l.grade).live;
      const ids=l.ownerId===l.engineerId?[l.ownerId]:[l.ownerId,l.engineerId];
      for(const id of ids){ if(!id)continue; const v=get(id);
        if(live){v.liv++; if(f.k==='late')v.lt++; if(f.k==='today')v.td++; if(g.stale)v.st++;}
        if(l.grade==='proj')v.pr++; if(l.grade==='dead')v.dd++; }
    }
    return m;
  },[all&&all.leads]);

  const projNums=new Set(leads.filter(l=>String(l.projectNo||'').trim()).map(l=>String(l.projectNo).trim())).size;
  const rate=closed?Math.round(proj/closed*100):0;
  const mx=Math.max(1,...GRADES.map(x=>g(x.id)));
  /* بدون clients.find جوه الحلقة — العميل متحسب مسبقاً لكل سجل */
  const group=f=>{const m={};leads.forEach((l,i)=>{
      const k=f(l,M.cA[i])||'غير محدد';m[k]=(m[k]||0)+1});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,7)};

  return <div className="wrap">
    <div className="kpis" style={{marginBottom:16}}>
      <Kpi v={leads.length} l="إجمالي السجلات" sub={clients.length+' عميل'} onClick={()=>go('records')}/>
      <Kpi v={projNums||proj} l="مشاريع موقّعة" k="g"
        sub={projNums&&projNums!==proj?proj+' سجل':''}/>
      <Kpi v={leads.filter(l=>gradeOf(l.grade).live).length} l="اسكتشات نشطة" k="b"/>
      <Kpi v={g('vimp')} l="هام جدا — على التوقيع" k="r"/>
      <Kpi v={late} l="متأخر التواصل" k="r" onClick={()=>go('today')}/>
      <Kpi v={tod} l="تواصل اليوم" k="a" onClick={()=>go('today')}/>
    </div>

    {(noDate>0||stale>0||orphan>0)&&<div className="warn" style={{marginBottom:16}}>
      {noDate>0&&<div>◆ <b>{noDate}</b> سجل نشط <b>بدون موعد تواصل</b> — المتابعة الآلية معطّلة عليه تماماً.</div>}
      {stale>0&&<div>◆ <b>{stale}</b> سجل راكد فوق الحد المسموح لدرجته — محتاج قرار.</div>}
      {orphan>0&&<div>◆ <b>{orphan}</b> سجل مسؤوله أو مهندسه مش موجود في المستخدمين — مش ظاهر لأي مهندس.</div>}
    </div>}
    <GroupCta clients={clients} go={go}/>

    <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))'}}>
      <div className="card">
        <div className="card-h"><span className="dot"/><h3>سلّم الجدية — من أول اتصال للتوقيع</h3></div>
        <div className="funnel">
          {GRADES.map(x=>(
            <div className={'fr '+(x.id==='proj'?'win':x.id==='dead'?'lost':'')} key={x.id} title={x.d}>
              <div className="nm">{x.l}</div>
              <div className="bar"><div className="fill" style={{width:(g(x.id)/mx*100)+'%'}}/></div>
              <div className="c">{g(x.id)}</div></div>))}
          <div className="conv">
            <div className="big">{rate}%</div>
            <div className="tx">نسبة التحويل لمشروع موقّع<br/>
              على <b>{closed}</b> سجل خرج من السلّم ({proj} موقّع / {dead} غير فعال)</div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-h"><span className="dot"/><h3>مصدر العميل</h3></div>
        <div style={{padding:16}}><Bars rows={group((l,c)=>c.source)}/></div></div>
      <div className="card">
        <div className="card-h"><span className="dot"/><h3>من طرف — قناة الإحالة الحقيقية</h3></div>
        <div style={{padding:16}}><Bars rows={group((l,c)=>c.refBy||'بدون إحالة')}/></div></div>
      <div className="card">
        <div className="card-h"><span className="dot"/><h3>المسؤول</h3></div>
        <div style={{padding:16}}><Bars rows={group(l=>uName(db,l.ownerId))}/></div></div>
      <div className="card">
        <div className="card-h"><span className="dot"/><h3>المنطقة</h3></div>
        <div style={{padding:16}}><Bars rows={group((l,c)=>c.area||c.emirate)}/></div></div>
      <div className="card">
        <div className="card-h"><span className="dot"/><h3>المطلوب حالياً</h3></div>
        <div style={{padding:16}}><Bars rows={REQUIRED.map(r=>[r,leads.filter(l=>l.required===r&&gradeOf(l.grade).live).length])}/></div></div>
      <div className="card">
        <div className="card-h"><span className="dot"/><h3>حالة التصميم</h3></div>
        <div style={{padding:16}}><Bars rows={WORKST.map(w=>[w,leads.filter(l=>l.workst===w).length])}/></div></div>
    </div>

    {me.role==='owner'&&all&&<div className="card" style={{marginTop:14}}>
      <div className="card-h"><span className="dot"/><h3>أداء المهندسين — حِمل كل واحد ومتأخراته</h3></div>
      <div className="scroll"><table>
        <thead><tr><th>المهندس</th><th>نشط</th><th>متأخر</th><th>اليوم</th><th>راكد</th><th>موقّع</th><th>غير فعال</th><th>التحويل</th></tr></thead>
        <tbody>{(all.users||[]).filter(u=>u.active!==false).map(u=>{
          const v=ENG.get(u.id)||{liv:0,lt:0,td:0,st:0,pr:0,dd:0};
          const liv={length:v.liv}, lt=v.lt, td=v.td, st=v.st, pr=v.pr, dd=v.dd;
          const cl=pr+dd;
          return <tr key={u.id}>
            <td><b>{u.name}</b> {u.role==='owner'&&<Tag c="t-gold">مالك</Tag>}</td>
            <td className="num">{liv.length}</td>
            <td>{lt?<Tag c="t-red">{lt}</Tag>:<span className="hint">0</span>}</td>
            <td>{td?<Tag c="t-amber">{td}</Tag>:<span className="hint">0</span>}</td>
            <td>{st?<Tag c="t-amber">{st}</Tag>:<span className="hint">0</span>}</td>
            <td className="num">{pr}</td><td className="num">{dd}</td>
            <td>{cl?<Tag c={pr/cl>=.5?'t-green':pr/cl>0?'t-amber':'t-red'}>{Math.round(pr/cl*100)}%</Tag>:<span className="hint">لسه</span>}</td>
          </tr>})}</tbody>
      </table></div>
      <div className="hint" style={{padding:'10px 14px'}}>
        لو مهندس عنده متأخرات كتير مع حِمل عالي، المشكلة توزيع مش أداء. وزّع من عمود «المسؤول» في سجل العملاء.
      </div>
    </div>}
  </div>;
}

        ? <Tag c={dd>0?'t-red':dd===0?'t-amber':'t-blue'}>

      <span className="num">{recType(l)==='مشروع'?'مشروع '+l.projectNo:'اسكتش '+l.sketchNo}</span>
      {' · '}{l.subType||'—'}{l.engineerId&&l.engineerId!==me.id?' · م/'+uname:''}
    </div>
    {l.notes&&<div className="note">{l.notes}</div>}

        value="" onChange={e=>{if(e.target.value){snooze(l,+e.target.value);e.target.value=''}}}>
        <option value="">ترحيل…</option>
        <option value="1">بكرة</option><option value="3">بعد ٣ أيام</option>
        <option value="7">أسبوع</option><option value="14">أسبوعين</option><option value="30">شهر</option>

const DSEC=[
 {id:'late', l:'متأخر',     kind:'late',  hint:'دي أول حاجة تتعمل النهاردة — كل يوم تأخير بيقلّل فرصة التوقيع.'},
 {id:'now',  l:'اليوم',     kind:'today', hint:'المواعيد المستحقة النهاردة بالظبط.'},
 {id:'deliv',l:'التسليمات', kind:'deliv', hint:'مواعيد تسليم مستحقة أو خلال أسبوع. «تم التسليم» بيقفل حالة التصميم على Done.'},
 {id:'foll', l:'المتابعة',  kind:'foll',  hint:'قادم خلال أسبوع، أو راكد، أو من غير موعد أصلاً.'}
];
const STEP=20;

function Daily({db,me,open,logCall,done,snooze,go,onPrint}){
  /* الأقسام بتتحسب مرة واحدة وتتعاد لحد ما السجلات أو المستخدم يتغيّروا */
  const B=useMemo(()=>taskBuckets(db,l=>isMine(me,l)),[db.leads,db.clients,me]);
  const umap=useMemo(()=>uIdx(db),[db.users]);
  const noGrp=useMemo(()=>db.clients.reduce((n,c)=>n+(isGroup(c.waGroup)?0:1),0),[db.clients]);
  const total=B.late.length+B.now.length+B.deliv.length+B.foll.length;

  const [shut,setShut]=useState({});                 /* الأقسام المقفولة */
  const [lim,setLim]=useState({late:STEP,now:STEP,deliv:STEP,foll:STEP});

  return <div className="wrap">
    <div className="ptools">
      <button className="btn ghost sm" onClick={onPrint}>🖨 طباعة مهام اليوم — A4</button>
      <span className="hint">ورقة لكل مهندس، فيها مربعات تعليم وخانة توقيع.</span>
    </div>
    <div className="kpis" style={{marginBottom:18}}>
      <Kpi v={B.late.length}  l="متأخر"     k="r"/>
      <Kpi v={B.now.length}   l="اليوم"     k="a"/>
      <Kpi v={B.deliv.length} l="التسليمات" k="b"/>
      <Kpi v={B.foll.length}  l="المتابعة"  k="g"/>
    </div>

    {noGrp>0&&can(me,'groups')&&<div className="cta">
      <div className="tx"><b>{noGrp}</b> عميل من <b>{db.clients.length}</b> لسه مش مربوط بجروب الواتساب بتاعه.
        اربطهم مرة واحدة، وبعدها زرار «واتساب» هيفتح الجروب على طول.</div>
      <button className="btn gold" onClick={()=>go('groups')}>افتح شاشة ربط الجروبات</button>
    </div>}

    {total===0
      ? <div className="card empty"><div className="big">✦</div>
          <b style={{fontSize:15}}>مفيش مهام مستحقة عليك النهاردة</b>
          <div className="hint" style={{marginTop:6}}>
            {me.role==='owner'?'كل المواعيد قدّام ومفيش سجل راكد.':'شغلك نضيف. لو محتاج تشوف سجلات تانية اطلب الصلاحية من المالك.'}
          </div></div>
      : DSEC.map(sc=>{
          const items=B[sc.id];
          if(!items.length) return null;
          const isOpen=!shut[sc.id];
          const n=Math.min(lim[sc.id],items.length);
          return <div key={sc.id}>
            <div className="secbar" onClick={()=>setShut(o=>({...o,[sc.id]:!o[sc.id]}))}>
              <span className="dot"/>
              <h3>{sc.l} <span className="num">({items.length})</span></h3>
              <span className="grow"/>
              <span className="chev">{isOpen?'▾':'▸'}</span>
            </div>
            {isOpen&&<>
              <div className="hint" style={{marginBottom:10}}>{sc.hint}</div>
              <div className="fcards" style={{marginBottom:n<items.length?12:22}}>
                {items.slice(0,n).map(x=>
                  <TaskCard key={x.l.id} {...x} kind={sc.kind} me={me}
                    uname={(umap.get(x.l.engineerId)||{}).name||''}
                    open={open} logCall={logCall} done={done} snooze={snooze}/>)}
              </div>
              {n<items.length&&<div className="moreb">
                <button className="btn ghost sm"
                  onClick={()=>setLim(o=>({...o,[sc.id]:o[sc.id]+STEP}))}>
                  تحميل المزيد — فاضل <span className="num">{items.length-n}</span>
                </button>
              </div>}
            </>}
          </div>;
        })}
  </div>;
}

const EdSel=({v,on,opts,cls='',ph='—'})=>(
  <select className={'ed '+cls} value={v||''} onChange={e=>on(e.target.value)} onClick={e=>e.stopPropagation()}>
    <option value="">{ph}</option>
    {opts.map(o=>typeof o==='string'
      ?<option key={o} value={o}>{dsp(o)}</option>
      :<option key={o.id} value={o.id} disabled={!!o.d}>{dsp(o.l)}</option>)}

/* لو القيمة المخزّنة اتشالت من القوائم، نضيفها للعرض عشان القيمة ما تختفيش من الشاشة */
const withVal=(opts,v)=>{
  const t=String(v==null?'':v); if(!t) return opts;
  const has=opts.some(o=>String(typeof o==='string'?o:o.id)===t);
  if(has) return opts;
  return typeof opts[0]==='object'
    ? [...opts,{id:t,l:'(محذوف)'}]
    : [...opts,t];
};
const EdTxt=({v,on,cls='',ph='',k})=>(

    onClick={e=>e.stopPropagation()}
    onBlur={e=>{if(e.target.value!==(v||''))on(e.target.value)}}
    onKeyDown={e=>{if(e.key==='Enter')e.target.blur()}}/>);
/* زي EdTxt بس بتتمدّد رأسياً عشان النص الطويل (وصف/ملاحظات) يبان كامل من غير ما يتقطع */
const EdArea=({v,on,cls='',ph='',k})=>{
  const grow=el=>{ if(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; } };
  return <textarea key={k} ref={grow} rows={1} className={'ed area '+cls} defaultValue={v||''} placeholder={ph} title={v||''}
    onClick={e=>e.stopPropagation()}
    onInput={e=>grow(e.target)}
    onBlur={e=>{if(e.target.value!==(v||''))on(e.target.value)}}

function Records({db,me,open,add,logCall,patchLead,patchClient,cols,setCols,onPrint,toast,recF,setRecF,archived,done}){
  const [fixN,setFixN]=useState(0);   /* لإرجاع الخانة لقيمتها لو الرقم مرفوض */
  const {q,fg,fo,fr,ff,ft,fw,sort,page,per}=recF;
  const setQ=v=>setRecF(s=>({...s,q:v}));
  const setFg=v=>setRecF(s=>({...s,fg:v}));
  const setFo=v=>setRecF(s=>({...s,fo:v}));
  const setFr=v=>setRecF(s=>({...s,fr:v}));
  const setFf=v=>setRecF(s=>({...s,ff:v}));
  const setFt=v=>setRecF(s=>({...s,ft:v}));
  const setFw=v=>setRecF(s=>({...s,fw:v}));
  const setSort=v=>setRecF(s=>({...s,sort:v}));
  const setPage=v=>setRecF(s=>({...s,page:v}));
  const setPer=v=>setRecF(s=>({...s,per:v}));
  /* خريطة العملاء مرة واحدة — بدل clients.find لكل سجل */
  const cmap=useMemo(()=>{const m=new Map();db.clients.forEach(c=>m.set(c.id,c));return m},[db.clients]);
  const cOf=id=>cmap.get(id)||{};
  const vis=COLS.filter(c=>cols.includes(c.id));
  /* ترتيب الصفوف بيتثبّت — يتغيّر بس لما الفلاتر/البحث/الترتيب يتغيّروا فعلياً،
     مش كل ما تعدّل قيمة في سجل. كده الصف مش بيقفز من تحتك وانت بتعدّل. */
  const orderRef=useRef({key:'',ids:[]});

  const rows=useMemo(()=>{
    const r=db.leads.map(l=>({l,f:followUp(l),s:inGrade(l),dl:deliverStatus(l),c:cOf(l.clientId)}))
    .filter(({l,f,c})=>{
      if(archived?l.workst!=='Done':l.workst==='Done')return false;
      if(fg&&l.grade!==fg)return false;
      if(fo&&l.ownerId!==fo)return false;
      if(fr&&l.required!==fr)return false;
      if(ft&&recType(l)!==ft)return false;
      if(ff&&f.k!==ff)return false;
      if(fw&&l.workst!==fw)return false;
      if(q){const t=(c.name+' '+c.phone+' '+(c.area||'')+' '+l.sketchNo+' '+(l.projectNo||'')+' '+(l.desc||'')+' '+(l.notes||'')).toLowerCase();
        if(!t.includes(q.toLowerCase()))return false}
      return true;});
    /* الترتيب بيتحسب من جديد بس لو فعلاً الفلاتر/البحث/طريقة الترتيب اتغيّروا.
       غير كده بنحافظ على نفس ترتيب الصفوف اللي كان ظاهر، ونضيف أي سجل جديد في الآخر. */
    const sigKey=JSON.stringify([archived,q,fg,fo,fr,ff,ft,fw,sort]);
    let ordered;
    if(orderRef.current.key!==sigKey){
      ordered=r.slice();
      if(sort==='num') ordered.sort((a,b)=>(+b.l.sketchNo||0)-(+a.l.sketchNo||0));
      else if(sort==='name') ordered.sort((a,b)=>a.c.name.localeCompare(b.c.name,'ar'));
      else if(sort==='stale') ordered.sort((a,b)=>b.s.days-a.s.days);
      else ordered.sort((a,b)=>b.f.days-a.f.days||String(b.l.createdAt).localeCompare(a.l.createdAt));
    }else{
      const byId=new Map(r.map(x=>[x.l.id,x]));
      const seen=new Set(); ordered=[];
      orderRef.current.ids.forEach(id=>{const x=byId.get(id); if(x){ordered.push(x); seen.add(id)}});
      r.forEach(x=>{if(!seen.has(x.l.id)){ordered.push(x); seen.add(x.l.id)}});
    }
    orderRef.current={key:sigKey, ids:ordered.map(x=>x.l.id)};
    return ordered;},[db.leads,cmap,me,q,fg,fo,fr,ff,ft,fw,sort,archived]);

  /* وصف الفلاتر الشغّالة — بيتطبع فوق الجدول عشان الورقة تفسّر نفسها */
  const filterLabel=[
    q&&('بحث: '+q), ft&&('النوع: '+ft),
    fg&&('الجدية: '+gradeOf(fg).l), fr&&('المطلوب: '+fr),
    fo&&('المسؤول: '+uName(db,fo)), fw&&('الحالة: '+fw),
    ff&&('المتابعة: '+({late:'متأخر',today:'اليوم',next:'قادم',none:'بدون موعد'}[ff]))
  ].filter(Boolean).join(' · ');

  /* الإزاحة التراكمية: كل عمود مثبّت يبدأ بعد مجموع عرض اللي قبله */
  const stk={}; let acc=0, lastStk=null;
  vis.forEach(c=>{ if(STK[c.id]!==undefined){ stk[c.id]=acc; acc+=STK[c.id]; lastStk=c.id; } });
  const stkProps=id=>STK[id]===undefined?{}:{
    className:'stk stk-'+id+(id!=='name'?' stkOpt':'')+(id===lastStk?' stkEdge':''),
    style:{'--stk':stk[id]+'px',width:STK[id],minWidth:STK[id],maxWidth:STK[id],whiteSpace:'normal'}
  };

  /* أي تغيير في البحث أو الفلاتر أو الترتيب أو حجم الصفحة → نرجع لأول صفحة */
  useEffect(()=>{setPage(1)},[q,fg,fo,fr,ff,ft,sort,per]);
  /* التقسيم بيحصل بعد الفلترة والترتيب — الصفحة بتتقصّ من النتائج الكاملة */
  const pages=Math.max(1,Math.ceil(rows.length/per));
  const cur=Math.min(page,pages);
  const from=rows.length?(cur-1)*per+1:0, to=Math.min(cur*per,rows.length);
  const pageRows=rows.slice((cur-1)*per,cur*per);

  const uids=new Set((db.users||[]).map(u=>u.id));
  const orphan=db.leads.filter(l=>(l.ownerId&&!uids.has(l.ownerId))||(l.engineerId&&!uids.has(l.engineerId))).length;
  const locked=rows.filter(r=>!canEdit(me,r.l)).length;

  /* فهرس المشاريع: يتبني مرة واحدة للجدول كله — مش لكل صف.
     Map للأرقام المحجوزة و Set للأرقام المتاحة، فمفيش مسح متكرر. */
  /* فهرس أرقام المشاريع المحجوزة — يتبني مرة واحدة للجدول كله بـ useMemo،
     فمفيش أي مسح للسجلات أو العملاء جوه الصفوف. */
  /* بيانات العميل (الاسم/التليفون/المنطقة/المصدر...) بتتعدّل بصلاحية «يعدّل سجلات غيره» بس —
     كونك مسؤول أو مهندس السجل بيدّيك حق تعدّل تقدّم شغلك، مش حق تعدّل هوية العميل. */
  const canEditClientData=me.role==='owner'||can(me,'editAll');

  const projTaken=useMemo(()=>{
    const m=new Map();
    db.leads.forEach(x=>{const v=String(x.projectNo||'').trim();if(v)m.set(v,x)});
    return m;
  },[db.leads]);

  /* إدخال يدوي: الرقم بيتاخد من ERP. بنتحقق من عدم التكرار بس. */
  const setProjNum=lead=>v=>{
    const val=String(v||'').trim();
    const cur=String(lead.projectNo||'').trim();
    if(val===cur) return;
    if(val){
      const own=projTaken.get(val);
      if(own&&own.id!==lead.id){
        const c=cOf(own.clientId);
        toast('رقم المشروع '+val+' مستخدم في سجل '+(c.name||'—')+' — اختر رقم تاني');
        setFixN(x=>x+1);           /* بيرجّع الخانة لقيمتها الأصلية */
        return;
      }
    }
    patchLead(lead.id,{projectNo:val});
  };

  const P=(id,k)=>v=>patchLead(id,{[k]:v});
  const PC=(id,k)=>v=>patchClient(id,{[k]:v});

  /* راسم الخانة — عمود واحد = حالة واحدة، فالعناوين والبيانات مستحيل يزحفوا */
  const cell=(id,r)=>{
    const {l,f,s,c}=r;
    /* صلاحية التعديل: سجلي، أو عندي «يعدّل سجلات غيره».
       بيانات العميل تتعدّل لو أقدر أعدّل أي سجل من سجلاته. */
    const ed=canEdit(me,l);
    const edC=canEditClientData;
    const LEAD_C=['proj','sk','grade','req','work','type','main','desc','owner','eng','last','next','deliver','notes'];
    const CLI_C=['name','phone','emirate','area','source','refBy'];
    if((LEAD_C.includes(id)&&!ed)||(CLI_C.includes(id)&&!edC)){
      return <span className="ro" title="مش مسموحلك تعدّل السجل ده">{printCell(id,r,db)||'—'}</span>;
    }
    /* أعمدة الهوية — التعديل من داخل الملف بس، عشان ما تتغيّرش بالغلط من الجدول */
    if(ID_COLS.includes(id)){
      if(id==='name') return <button className="nml" onClick={()=>open(l)}
        title="اضغط تفتح الملف — الاسم والتليفون وأرقام المشروع والاسكتش بيتعدّلوا من جوه">
        {c.name||'—'}{c.vip?' ★':''}</button>;
      return <span className="ro" title="التعديل من داخل الملف">{printCell(id,r,db)||'—'}</span>;
    }
    switch(id){
      case 'name':   return <EdTxt k={l.id+'n'} v={c.name} on={PC(c.id,'name')} cls="nm" ph="اسم العميل"/>;
      case 'phone':  return <EdTxt k={l.id+'t'+c.phone} v={phoneOut(c.phone)} on={PC(c.id,'phone')} cls="ltr" ph="05xxxxxxxx"/>;
      case 'group':  return isGroup(c.waGroup)
        ? <div className="rowbtns">
            <a className="btn wa xs" href={c.waGroup} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()}>واتساب · الجروب</a>
            {edC&&<button className="btn ghost xs" title="تغيير الرابط" onClick={()=>PC(c.id,'waGroup')('')}>↺</button>}
          </div>
        : <div className="rowbtns" style={{alignItems:'center'}}>
            <a className="btn ghost xs" href={waLink(c.phone)} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()}
               title="لسه مش مربوط بجروب — بيفتح محادثة فردية">واتساب</a>
            {edC
              ? <EdTxt k={l.id+'g'} v={c.waGroup} on={PC(c.id,'waGroup')} cls="ltr" ph="الصق رابط الجروب"/>
              : <span className="ro">—</span>}
          </div>;
      case 'proj':   return <EdTxt k={l.id+'p'+(l.projectNo||'')+'|'+fixN}
          v={l.projectNo} on={setProjNum(l)} cls="ltr" ph="اسكتش"/>;
      case 'sk':     return <EdTxt k={l.id+'s'} v={l.sketchNo} on={P(l.id,'sketchNo')} cls="ltr"/>;
      case 'grade':  return <>
          <EdSel v={l.grade} on={P(l.id,'grade')} opts={GRADES} cls={'g '+gradeOf(l.grade).c}/>
          {l.grade==='dead'&&!l.lossReason&&<div style={{marginTop:4}}>
            <EdSel v={l.lossReason} on={P(l.id,'lossReason')} opts={LOSS} ph="السبب؟" cls="t-red"/></div>}
        </>;
      case 'req':    return <EdSel v={l.required} on={P(l.id,'required')} opts={REQUIRED}/>;
      case 'work':   return <EdSel v={l.workst} on={P(l.id,'workst')} opts={WORKST}/>;
      case 'follow': return <Tag c={f.c}>{f.l}</Tag>;
      case 'last':   return <EdDate v={l.lastDate} on={P(l.id,'lastDate')}/>;
      case 'next':   return <EdDate v={l.nextDate} on={P(l.id,'nextDate')}/>;
      case 'stale':  return gradeOf(l.grade).live?<Tag c={s.stale?'t-amber':'t-gray'}>{s.days} يوم</Tag>:'—';
      case 'type':   return <EdSel v={l.subType} on={P(l.id,'subType')} opts={withVal(db.lookups.subType,l.subType)} cls="wide2"/>;
      case 'main':   return <EdSel v={l.mainType} on={P(l.id,'mainType')} opts={withVal(db.lookups.mainType,l.mainType)} cls="wide2"/>;
      case 'desc':   return <EdArea k={l.id+'d'} v={l.desc} on={P(l.id,'desc')} cls="wide" ph="وصف المشروع"/>;
      case 'owner':  return <EdSel v={l.ownerId} on={P(l.id,'ownerId')} opts={withVal(uOpts(db),l.ownerId)} cls="wide2"/>;
      case 'eng':    return <EdSel v={l.engineerId} on={P(l.id,'engineerId')} opts={withVal(uOpts(db),l.engineerId)} cls="wide2"/>;
      case 'emirate':return <EdSel v={c.emirate} on={PC(c.id,'emirate')} opts={withVal(db.lookups.emirate,c.emirate)} cls="wide2"/>;
      case 'area':   return <EdSel v={c.area} on={PC(c.id,'area')} opts={withVal(db.lookups.area,c.area)} cls="wide2"/>;
      case 'source': return <EdSel v={c.source} on={PC(c.id,'source')} opts={withVal(db.lookups.source,c.source)} cls="wide2"/>;
      case 'refBy':  return <EdArea k={l.id+'r'} v={c.refBy} on={PC(c.id,'refBy')} ph="مين حوّله"/>;
      case 'deliver':return <EdDate v={l.deliverDate} on={P(l.id,'deliverDate')}/>;
      case 'notes':  return <EdArea k={l.id+'o'} v={l.notes} on={P(l.id,'notes')} cls="wide" ph="ملاحظات"/>;
      case 'act':    return <div className="rowbtns">
          {ed&&l.deliverDate&&l.workst!=='Done'&&
            <button className="btn sm gold" onClick={()=>done(l,true)}>تم التسليم</button>}
          <button className="btn sm ghost" onClick={()=>logCall(l)}>تواصل</button>
          <button className="btn sm ghost" onClick={()=>open(l)}>ملف</button></div>;
      default: return null;
    }
  };

  return <div className="wrap">
    <div className="filt">
      <input className="in" style={{minWidth:175,flex:'1 1 175px'}} placeholder="بحث بالاسم / التليفون / رقم / ملاحظة…" value={q} onChange={e=>setQ(e.target.value)}/>
      <select className="in" value={ft} onChange={e=>setFt(e.target.value)}><option value="">النوع</option><option>اسكتش</option><option>مشروع</option></select>
      <select className="in" value={fg} onChange={e=>setFg(e.target.value)}><option value="">كل الدرجات</option>{GRADES.map(x=><option key={x.id} value={x.id}>{x.l}</option>)}</select>
      <select className="in" value={fr} onChange={e=>setFr(e.target.value)}><option value="">المطلوب</option>{REQUIRED.map(r=><option key={r} value={r}>{dsp(r)}</option>)}</select>
      <select className="in" value={fo} onChange={e=>setFo(e.target.value)}><option value="">المسؤول</option>{uOpts(db).map(o=><option key={o.id} value={o.id}>{o.l}</option>)}</select>
      <select className="in" value={ff} onChange={e=>setFf(e.target.value)}>
        <option value="">المتابعة</option><option value="late">متأخر</option><option value="today">اليوم</option>
        <option value="next">قادم</option><option value="none">بدون موعد</option></select>
      {!archived&&<select className="in" value={fw} onChange={e=>setFw(e.target.value)}><option value="">كل الحالات</option>{WORKST.map(w=><option key={w} value={w}>{w}</option>)}</select>}
      <select className="in" value={sort} onChange={e=>setSort(e.target.value)}>
        <option value="follow">ترتيب: الأكثر تأخيراً</option><option value="stale">ترتيب: الأكثر ركوداً</option>
        <option value="num">ترتيب: رقم الاسكتش</option><option value="name">ترتيب: الاسم</option></select>
      <ColPicker vis={cols} setVis={setCols}/>
      <button className="btn ghost sm" onClick={()=>onPrint({rows,colIds:cols,label:filterLabel})}>🖨 طباعة</button>
      {(q||fg||fo||fr||ff||ft||fw)&&<button className="btn sm ghost" onClick={()=>{setQ('');setFg('');setFo('');setFr('');setFf('');setFt('');setFw('')}}>مسح الفلاتر</button>}
      <span className="grow"/><span className="hint">{rows.length} سجل</span>
      {!archived&&<button className="btn gold" onClick={add}>+ سجل جديد</button>}
    </div>
    <div className="hint" style={{marginBottom:10}}>
      {archived
        ?<>السجلات دي حالتها <b>Done</b> فاتنقلت هنا تلقائياً من «سجل العملاء». غيّر «الحالة» لأي قيمة تانية من عمودها عشان السجل يرجع تاني لسجل العملاء العادي.</>
        :<>عدّل أي خانة من مكانها — بتتحفظ لوحدها. المنطقة والمصدر بيتغيّروا على العميل وكل اسكتشاته.
      <b>الاسم · رقم التليفون · اسكتش</b> بيتعدّلوا من <b>داخل الملف</b> بس — اضغط على اسم العميل يفتحلك.
      رقم المشروع بيتكتب يدوياً من الـERP — وأول ما تكتبه الجدية بتبقى «مشروع». والنظام بيرفض أي رقم مستخدم في سجل تاني.
      السجل اللي حالته Done بيتنقل تلقائياً لـ«الأرشيف».</>}
      {locked>0&&<> <b>{locked}</b> سجل معروض للقراءة بس — انت مش مسؤول ولا مهندس فيه.</>}
    </div>
    {orphan>0&&me.role==='owner'&&<div className="warn" style={{marginBottom:12}}>
      ◆ <b>{orphan}</b> سجل مسؤوله أو مهندسه مش موجود في المستخدمين — <b>مش ظاهر لأي مهندس</b>.
      حدّد له مسؤول من عمود «المسؤول».
    </div>}

    <div className="card"><div className="scroll"><table>
      <thead><tr>{vis.map(c=><th key={c.id} {...stkProps(c.id)}>{c.l}</th>)}</tr></thead>
      <tbody>{pageRows.map(r=>(
        <tr key={r.l.id} className={r.dl.k==='late'?'late':r.dl.k==='today'?'today':''}>
          {vis.map(c=><td key={c.id} {...stkProps(c.id)}>{cell(c.id,r)}</td>)}
        </tr>))}</tbody>
    </table>{rows.length===0&&<div className="empty">{archived?'مفيش سجلات في الأرشيف.':'مفيش سجلات مطابقة.'}</div>}</div>

      {rows.length>0&&<div className="pgbar">
        <button className="btn ghost sm" disabled={cur<=1} style={cur<=1?{opacity:.4}:{}}
          onClick={()=>setPage(cur-1)}>› السابق</button>
        <span className="hint">صفحة <b className="num">{cur}</b> من <b className="num">{pages}</b></span>
        <button className="btn ghost sm" disabled={cur>=pages} style={cur>=pages?{opacity:.4}:{}}
          onClick={()=>setPage(cur+1)}>التالي ‹</button>
        <span className="grow"/>
        <span className="hint">عرض <b className="num">{from}</b>–<b className="num">{to}</b> من <b className="num">{rows.length}</b> سجل</span>
        <select className="in" style={{width:'auto',padding:'6px 9px',fontSize:12.5}}
          value={per} onChange={e=>setPer(+e.target.value)}>
          <option value={25}>25 في الصفحة</option>
          <option value={50}>50 في الصفحة</option>
          <option value={100}>100 في الصفحة</option>
        </select>
      </div>}
    </div>

  </div>;
}


/* ============ درج السجل ============ */
function LeadDrawer({db,me,lead,close,save,del,logCall,revert}){
  const isNew=!lead.id;
  const c0=db.clients.find(c=>c.id===lead.clientId)||{};
  const [L,setL]=useState({...lead});
  const [C,setC]=useState({name:'',phone:'',emirate:'الشارقة',area:'',source:'Individual',refBy:'',waGroup:'',vip:false,...c0,phone:phoneOut(c0.phone)});
  const [tab,setTab]=useState('info');
  const set=(k,v)=>setL(p=>({...p,[k]:v})); const setc=(k,v)=>setC(p=>({...p,[k]:v}));
  const logs=useMemo(()=>(idxGroup(db.inter,'leadId').get(lead.id)||[])
    .slice().sort((a,b)=>b.date.localeCompare(a.date)),[db.inter,lead.id]);
  const sib=useMemo(()=>(idxGroup(db.leads,'clientId').get(L.clientId)||[]).filter(l=>l.id!==L.id),
    [db.leads,L.clientId]);
  /* لو اتكتب رقم مشروع، الجدية هتبقى «مشروع» عند الحفظ — فالتحقق لازم يحسبها كده
     وإلا هيطلب «الموعد المتوقع» لسجل مش هيبقى نشط أصلاً */
  const effGrade=(String(L.projectNo||'').trim()&&L.grade!=='dead')?'proj':L.grade;
  const live=gradeOf(effGrade).live;
  const dup=db.clients.find(x=>x.id!==C.id&&x.phone===normPhone(C.phone));
  const s=isNew?null:inGrade(L);

  const mayEdit=isNew||canEdit(me,lead);
  /* بيانات العميل تتعدّل بصلاحية «يعدّل سجلات غيره» بس — إلا وقت إنشاء سجل جديد،
     لازم تدخل بيانات العميل ولو أول مرة، حتى لو مفيش عندك الصلاحية دي */
  const mayEditClient=isNew||me.role==='owner'||can(me,'editAll');
  const pdup=(()=>{const v=String(L.projectNo||'').trim();if(!v)return null;
    return db.leads.find(x=>x.id!==L.id&&String(x.projectNo||'').trim()===v)||null})();
  const err=!mayEdit?'مش مسموحلك تعدّل السجل ده'
    :pdup?('رقم المشروع '+String(L.projectNo).trim()+' مستخدم في سجل تاني')
    :!C.name.trim()?'الاسم مطلوب'
    :!C.phone.trim()?'رقم التليفون مطلوب'
    :(live&&!L.nextDate)?'حدّد الموعد المتوقع للتواصل'
    :(L.grade==='dead'&&!L.lossReason)?'اختر سبب عدم الفاعلية'
    :'';

  return <div className="ov" onClick={e=>e.target===e.currentTarget&&close()}>
   <div className="dw">
    <div className="dw-h">
      <div><h3>{isNew?'سجل جديد':C.name}</h3>
        <div className="s num">{isNew?'هياخد رقم اسكتش تلقائي'
          :(recType(L)==='مشروع'?'مشروع '+L.projectNo+' · اسكتش '+L.sketchNo:'اسكتش '+L.sketchNo)}</div></div>
      <button className="x" onClick={close}>×</button>
    </div>
    <div className="dw-b">
      {!isNew&&<div className="tabs">
        <button className={tab==='info'?'on':''} onClick={()=>setTab('info')}>البيانات</button>
        <button className={tab==='log'?'on':''} onClick={()=>setTab('log')}>سجل التواصل ({logs.length})</button>
        <button className={tab==='hist'?'on':''} onClick={()=>setTab('hist')}>تدرّج الجدية</button>
        <button className={tab==='chg'?'on':''} onClick={()=>setTab('chg')}>سجل التعديلات</button>

/* ============ تسجيل تواصل ============ */
function CallModal({db,lead,close,submit}){
  const c=db.clients.find(x=>x.id===lead.clientId)||{};
  const [f,setF]=useState({date:todayISO(),channel:'اتصال',outcome:'تم الرد',note:'',byId:lead.ownerId||'',
    next:addDays(todayISO(),7),grade:lead.grade,required:lead.required,workst:lead.workst,lossReason:lead.lossReason||''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const live=gradeOf(f.grade).live;
  const err=!f.note.trim()?'اكتب خلاصة المكالمة'
    :(live&&!f.next)?'حدّد الموعد الجاي'
    :(f.grade==='dead'&&!f.lossReason)?'اختر سبب عدم الفاعلية':'';
  return <div className="mo" onClick={e=>e.target===e.currentTarget&&close()}>
    <div className="box">
      <h3>تسجيل تواصل — {c.name}</h3>
      <div className="bd">
        <div className="grid" style={{gridTemplateColumns:'1fr 1fr'}}>
          <Field label="التاريخ"><input type="date" className="in num" value={f.date} onChange={e=>set('date',e.target.value)}/></Field>
          <Field label="الوسيلة"><Sel v={f.channel} on={v=>set('channel',v)} opts={CHANNELS} ph="اختر"/></Field>
          <Field label="نتيجة الاتصال"><Sel v={f.outcome} on={v=>set('outcome',v)} opts={OUTCOMES} ph="اختر"/></Field>
          <Field label="بواسطة"><Sel v={f.byId} on={v=>set('byId',v)} opts={uOpts(db)}/></Field>
        </div>
        <Field label="خلاصة المكالمة" req hint="بتتكتب في الملاحظات وتفضل في سجل التواصل">
          <textarea className="in" value={f.note} onChange={e=>set('note',e.target.value)} placeholder="اللي اتقال والمطلوب…"/></Field>
        <div className="grid" style={{gridTemplateColumns:'1fr 1fr'}}>
          <Field label="الجدية بعد المكالمة"><Sel v={f.grade} on={v=>set('grade',v)} opts={GRADES} ph="اختر"/></Field>
          <Field label="المطلوب"><Sel v={f.required} on={v=>set('required',v)} opts={REQUIRED}/></Field>
        </div>
        {f.grade==='dead'&&<Field label="سبب عدم الفاعلية" req>
          <Sel v={f.lossReason} on={v=>set('lossReason',v)} opts={LOSS} ph="اختر السبب"/></Field>}
        {live&&<Field label="الموعد المتوقع للتواصل الجاي" req>
          <input type="date" className="in num" value={f.next} onChange={e=>set('next',e.target.value)}/>
          <div className="chips" style={{marginTop:7}}>
            {[[2,'يومين'],[7,'أسبوع'],[14,'أسبوعين'],[30,'شهر'],[90,'٣ شهور']].map(([n,t])=>
              <button key={n} className="btn sm ghost" onClick={()=>set('next',addDays(todayISO(),n))}>{t}</button>)}
          </div></Field>}
      </div>
      <div className="ft">
        <button className="btn gold" disabled={!!err} style={err?{opacity:.45}:{}} onClick={()=>submit(lead,f)}>{err||'حفظ التواصل'}</button>
        <button className="btn ghost" onClick={close}>إلغاء</button>
      </div>
    </div></div>;
}

/* ============ العملاء ============ */
